name: Update data

# Korean close: 16:10 KST (07:10 UTC) Mon–Fri. US close: 06:30 KST (21:30 UTC) Mon–Fri ET evenings.
# Saturday 10:30 KST catch-up, in case the vendor had not finalised Friday's bars at 06:30.
on:
  schedule:
    - cron: '10 7 * * 1-5'
    - cron: '30 21 * * 1-5'
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-and-pages
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Pipeline tests
        working-directory: pipeline
        run: python -m unittest discover -s tests
      - name: Fetch prices and build cards
        working-directory: pipeline
        run: python -m gam.run fetch
      - name: Commit data
        run: |
          git config user.name "gam-data"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open('public/data/status.json'))
          print('| id | ok | last | note |\n|---|---|---|---|')
          for r in s['results']:
              print(f"| {r['id']} | {'✅' if r['ok'] else '❌'} | {r.get('asOf') or ''} | {(r.get('error') or r.get('source', ''))[:120]}{' · dropped incomplete ' + r['droppedTail'] if r.get('droppedTail') else ''} |")
          EOF

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so this run deploys the site itself.
  deploy:
    needs: data
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
